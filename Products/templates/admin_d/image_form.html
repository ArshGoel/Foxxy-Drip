{% extends "admin_d/base.html" %}
{% block content %}
<h3>Add / Edit Product Image</h3>

{% if form.errors %}
  <div style="color:red;">
    {{ form.errors }}
  </div>
{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- ✅ render all fields EXCEPT image -->
    {{ form.product }}
    {{ form.product_type }}
    {{ form.color }}
    {{ form.is_primary }}
    {{ form.show_in_shop }}
    {{ form.description }}

    <br><br>

    <!-- ✅ ONLY ONE image input, and name MUST BE image -->
    <label>Image:</label><br>
    <input type="file" id="imagesInput" name="image" accept="image/*" required>

    <br><br>
    <button type="submit">Save</button>
</form>

<script>
async function compressImage(file, quality = 0.7, maxWidth = 1400) {
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = (e) => { img.src = e.target.result; };

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      let width = img.width;
      let height = img.height;

      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }

      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(img, 0, 0, width, height);

      canvas.toBlob(
        (blob) => {
          const compressedFile = new File(
            [blob],
            file.name.replace(/\.\w+$/, ".jpg"),
            { type: "image/jpeg" }
          );
          resolve(compressedFile);
        },
        "image/jpeg",
        quality
      );
    };

    reader.readAsDataURL(file);
  });
}

document.getElementById("imagesInput").addEventListener("change", async function () {
  const file = this.files[0];
  if (!file) return;

  // compress only if > 2MB
  if (file.size > 2 * 1024 * 1024) {
    const compressed = await compressImage(file, 0.7, 1400);

    const dt = new DataTransfer();
    dt.items.add(compressed);
    this.files = dt.files;

    alert("Image compressed ✅");
  }
});
</script>

{% endblock %}
