{% extends "admin_d/base.html" %}
{% block content %}

<h2>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Design</h2>

{% if form.errors %}
  <div style="color:red;">
    {{ form.errors }}
  </div>
{% endif %}

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}

  <button type="submit">✅ Save Design</button>
</form>

{% endblock %}
